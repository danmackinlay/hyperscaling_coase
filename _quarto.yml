project:
  type: website
  output-dir: _site
  # Only real content renders; CLAUDE.md / README.md stay out of the site.
  render:
    - "*.qmd"

website:
  title: "Notes on agency"
  description: "Working notes on mechanised causal graphs, decision theory, and agency."
  reader-mode: true
  # To enable the RSS feed: set site-url to the deployed URL, re-add `feed: true`
  # to the listing in index.qmd, and add an rss navbar item linking to index.xml.
  # site-url: "https://example.com"
  navbar:
    left:
      - href: index.qmd
        text: Home

bibliography: references.bib

filters:
  - tikz

format:
  html:
    theme: cosmo
    toc: true
    comments:
      hypothesis: true

execute:
  freeze: true
tikz:
  renderer: tikzjax
  # cache: true
  ## pdftocairo (from poppler-utils) replaces inkscape as the SVG engine.
  ## Pre-installed on macOS via brew and on the ubuntu-latest GH Actions runner,
  ## so no extra install step needed anywhere. Lighter and faster than inkscape.
  # svg-engine: pdftocairo
  ## Project-root cache, relative-resolution trick: ../.tikz-cache from any
  ## depth-1 qmd (notebook/, post/, presentation/, …) converges on the same
  ## <project-root>/.tikz-cache. Depth-2 qmds (e.g. notebook/genbp/index.qmd)
  ## need a per-doc override of `../../.tikz-cache`. See README.md "Cache strategy".
  # cache-dir: ../.tikz-cache