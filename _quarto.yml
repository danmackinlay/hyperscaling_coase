project:
  type: website
  output-dir: _site
  # Only real content renders; CLAUDE.md / README.md stay out of the site.
  render:
    - "*.qmd"

website:
  title: "Notes on agency"
  description: "Working notes on mechanised causal graphs, decision theory, and agency."
  reader-mode: true
  # To enable the RSS feed: set site-url to the deployed URL, re-add `feed: true`
  # to the listing in index.qmd, and add an rss navbar item linking to index.xml.
  # site-url: "https://example.com"
  navbar:
    left:
      - href: index.qmd
        text: Home

bibliography: references.bib

filters:
  - tikz

format:
  html:
    theme: cosmo
    toc: true
    comments:
      hypothesis: true

execute:
  freeze: true
tikz:
  # Diagrams are pre-rendered to SVG and the results are COMMITTED to the repo
  # (see .tikz-cache/). Contributors without a TeX install can therefore render
  # the site normally — the filter finds every diagram in the cache and never
  # shells out to pdflatex. Only someone *editing* a .tikz block needs TeX.
  renderer: latex
  cache: true
  # Project-relative: every post is a top-level .qmd, so pandoc's cwd is the
  # project root and this resolves to <project-root>/.tikz-cache.
  cache-dir: .tikz-cache
  # Pinned, not left to the filter's defaults: the cache key is a hash of the
  # block source PLUS these engine names, so an upstream default change would
  # silently invalidate every committed entry.
  tex-engine: pdflatex
  # pdftocairo (poppler) rather than the default inkscape: it is lighter, is
  # already on both a brew macOS box and the ubuntu-latest GH Actions runner,
  # and needs no kpathsea wiring (the brew `dvisvgm` cannot find texmf.cnf).
  # It outlines text to paths, so the committed SVGs are self-contained.
  svg-engine: pdftocairo
